name: somics_os
description: "SOMICS OS Flutter source base."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  dartx: ^1.2.0
  firebase_messaging: ^16.0.0
  flutter_html: ^3.0.0
  flutter_local_notifications: ^19.4.2
  flutter_svg: ^2.2.1
  get: ^4.7.2
  http: ^1.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  skeletonizer: ^2.1.0
  universal_html: ^2.2.4
  url_launcher: ^6.3.2
  phone_numbers_parser: ^9.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/ui/
  fonts:
    - family: SF UI Display
      fonts:
        - asset: assets/fonts/SF-UI-Display-Regular.ttf
          weight: 400
        - asset: assets/fonts/SF-UI-Display-Bold.otf
          weight: 700
